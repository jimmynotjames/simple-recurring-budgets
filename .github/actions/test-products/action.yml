# Fetches the products ci.yml's `build` job compiled (build-for-testing) and sets XCTESTRUN, which
# makes the test scripts run them instead of building (prepare_test_args in scripts/_destination.sh).
# The products travel as a tarball because an artifact upload drops exec bits and symlinks, which
# the app and its frameworks need.
name: Test products
description: Download the build job's test products and point XCTESTRUN at their .xctestrun file.

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v8
      with:
        name: test-products

    - name: Unpack the test products
      shell: bash
      run: |
        mkdir -p .build/ci
        tar -xzf test-products.tgz -C .build/ci
        rm test-products.tgz
        found=$(find "$PWD/.build/ci/Products" -maxdepth 1 -name '*.xctestrun')
        echo "$found"
        xctestrun=$(head -1 <<<"$found")
        if [[ -z "$xctestrun" ]]; then
          echo "::error::The build job's products have no .xctestrun file"
          exit 1
        fi
        echo "XCTESTRUN=${xctestrun}" >> "$GITHUB_ENV"
