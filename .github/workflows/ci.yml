# Runs on every PR and on push to main.
#
# Mirrors the local lefthook gates (lefthook.yml) somewhere unbypassable: hooks can be
# skipped (`git push --no-verify`, hookless clone, web-UI merge). Branch protection on
# `main` should REQUIRE lint, secrets, check-large-files, i18n-gates, tests
# (repo Settings -> Rules -> Rulesets); without it CI is advisory.
#
# macOS work: `build` compiles once (build-for-testing), then `unit-tests` and the `ui-tests`
# shards (scripts/ci/ui_shards.py) run its products in parallel, one runner each. The ubuntu
# `tests` job sums them up and is the one test check the ruleset needs. The account runs at most 5
# macOS jobs at once across all its repos; a full run here takes 4 at a time (build, then 1 unit +
# 3 UI).
#
# Docs-only PRs skip build and every test job: the cheap `changes` job lists the PR's files and
# outputs code=false only when every one is docs (the rules are in scripts/ci/docs_only.py), and
# `tests` then passes. Pushes to main and any error reading the list output code=true. Never use a
# workflow-level paths-ignore for this: the required checks would never report.
# run-ui-tests-on-demand.yml re-runs just the UI suite on an open PR. App Store metadata /
# screenshot-content checks are deliberately NOT here: they are release-time (100+ PRs can land
# between releases) and run in the fastlane beta/release lanes (see fastlane/Fastfile).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# PRs: cancel superseded runs on the same branch. Pushes to main: one group per commit,
# so every merge gets its own complete run. Branch protection doesn't require PRs to be
# up to date with main, so this post-merge run is what catches two PRs that pass alone
# but break together.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # --- Tier 1: lint/format parity with local hooks (ubuntu) ------------------
  # Pin the EXACT versions installed locally via Homebrew; skew makes CI fail on rules
  # your machine doesn't enforce (or vice versa). Keep in lockstep with brew installs.
  lint:
    runs-on: ubuntu-latest
    env:
      SWIFTLINT_VERSION: "0.65.1"
      SWIFTFORMAT_VERSION: "0.64.1"
    steps:
      - uses: actions/checkout@v7

      - name: Cache pinned SwiftFormat binary
        uses: actions/cache@v6
        id: cache-swiftformat
        with:
          path: swiftformat_linux
          key: swiftformat-${{ env.SWIFTFORMAT_VERSION }}

      - name: Install pinned SwiftFormat (Linux release binary)
        if: steps.cache-swiftformat.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o swiftformat_linux.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat_linux.zip"
          unzip -o -q swiftformat_linux.zip
          chmod +x swiftformat_linux

      - name: SwiftFormat (check only, no rewrite)
        run: |
          ./swiftformat_linux --version
          ./swiftformat_linux --lint .

      # The official image, not the release zip: that binary needs libxml2.so.2, which
      # Ubuntu 26.04 (ubuntu-latest) dropped (realm/SwiftLint#6966). The workspace is
      # mounted at its own path so reported file paths match the checkout.
      - name: SwiftLint (strict, official Docker image)
        run: |
          image="ghcr.io/realm/swiftlint:${SWIFTLINT_VERSION}"
          docker run --rm "$image" version
          docker run --rm -v "$PWD:$PWD" -w "$PWD" "$image" lint --strict

  # --- Tier 1: secret scan (ubuntu) --------------------------------------------
  # Complements the local `gitleaks protect --staged` hook. Pinned binary instead of
  # gitleaks-action, which needs an org license.
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so `detect` can scan the whole tree
      - name: Cache pinned gitleaks binary
        uses: actions/cache@v6
        id: cache-gitleaks
        with:
          path: gitleaks
          key: gitleaks-${{ env.GITLEAKS_VERSION }}
      - name: Install pinned gitleaks
        if: steps.cache-gitleaks.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: gitleaks detect
        run: |
          ./gitleaks version
          ./gitleaks detect --no-banner --redact

  # --- check-large-files: reject oversized files added/changed in the PR -----
  # Mirrors the pre-commit hook (scripts/check-large-files.sh). CI has no staged
  # files, so diff against the PR base (or the prior push on push-to-main).
  check-large-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Diff files vs base
        id: diff
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          files=$(git diff --name-only --diff-filter=d "$base"...HEAD | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: check-large-files
        if: steps.diff.outputs.files != ''
        run: bash scripts/check-large-files.sh ${{ steps.diff.outputs.files }}

  # --- translation / localization gates (ubuntu) ------------------------------
  # Same gates as the pre-push hook, plus plural/untranslated-copy checks and a
  # non-blocking consistency report.
  i18n-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: check_translations.py
        run: python3 scripts/ci/annotate.py --name check_translations -- python3 scripts/check_translations.py
      - name: check_source_strings.py
        run: python3 scripts/ci/annotate.py --name check_source_strings -- python3 scripts/check_source_strings.py
      - name: check_metadata.py
        run: python3 scripts/ci/annotate.py --name check_metadata -- python3 scripts/translate_metadata/check_metadata.py
      - name: plural_completeness.py
        run: python3 scripts/ci/annotate.py --name plural_completeness -- python3 scripts/translate_audit/plural_completeness.py
      - name: untranslated_copies.py
        run: python3 scripts/ci/annotate.py --name untranslated_copies -- python3 scripts/translate_audit/untranslated_copies.py
      - name: consistency_check (informational, non-blocking)
        run: python3 scripts/translate_audit/consistency_check.py --ignore-casing || true

  # --- changes: does this PR need a build and tests? ---------------------------------
  # Docs-only PRs skip build, unit-tests and ui-tests, and the `tests` job then passes. The rules
  # are in scripts/ci/docs_only.py. Both the changed path and, for a rename, the previous one
  # count, so a file renamed out of the app folder is still code. Anything but a PR event, or a
  # failed read, means code=true.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - name: Classify the PR's files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # The files API stops at 3000 files, so a bigger PR could look docs-only; it counts as code.
          if [[ "$EVENT" != pull_request ]] \
            || ! count=$(gh api "repos/${REPO}/pulls/${PR}" --jq .changed_files) \
            || [[ ! "$count" =~ ^[0-9]+$ ]] || (( count >= 3000 )) \
            || ! files=$(gh api --paginate "repos/${REPO}/pulls/${PR}/files" \
              --jq '.[] | .filename, (.previous_filename // empty)'); then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/ci/docs_only.py <<<"$files" >> "$GITHUB_OUTPUT" \
            || echo "code=true" >> "$GITHUB_OUTPUT"

  # --- Tier 2: build once (macOS) ---------------------------------------------------
  # Compiles the app and both test targets once (build-for-testing) and hands the products to the
  # test jobs, which only run them, so a PR compiles once rather than once per test job. It is also
  # the compile check: on a failure each compile error becomes a PR annotation and a job-summary
  # line (scripts/ci/xcode_errors.py). Skipped on docs-only PRs, and with it every test job.
  build:
    runs-on: macos-26
    needs: [lint, secrets, check-large-files, i18n-gates, changes]
    # Runs after whichever gates ran; a failed gate still stops it.
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure')
      && needs.changes.outputs.code == 'true'
    # The 360-minute default would let one hung build hold a macOS runner for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ios-setup
        with:
          simulator: "false"
      - name: Cache SwiftPM packages
        uses: actions/cache@v6
        with:
          path: build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-xcode26.5-${{ hashFiles('simple-recurring-budgets.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode26.5-
      # For any simulator, so the products run on whichever device a test job's runner has.
      # Ad-hoc sign so entitlements (ubiquity-kvstore, CloudKit) are embedded.
      # CODE_SIGNING_ALLOWED=NO strips them and breaks NSUbiquitousKeyValueStore tests.
      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project simple-recurring-budgets.xcodeproj \
            -scheme simple-recurring-budgets \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            2>&1 | tee build-for-testing.log \
            || { python3 scripts/ci/xcode_errors.py build-for-testing.log; exit 1; }
      # A tarball, because an artifact upload drops the exec bits and symlinks the app needs.
      - name: Pack the test products
        run: tar -czf test-products.tgz -C build/DerivedData/Build Products
      - name: Upload the test products
        uses: actions/upload-artifact@v7
        with:
          name: test-products
          path: test-products.tgz
          retention-days: 1
          compression-level: 0 # already gzipped

  # --- Tier 2: tests (macOS), from the build job's products ----------------------------
  # unit-tests and every ui-tests shard run in parallel, one runner each, serial on one
  # simulator. The `tests` job below sums them up, and it is the one check the ruleset needs.
  unit-tests:
    runs-on: macos-26
    needs: [build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ios-setup
      - uses: ./.github/actions/test-products
      # Under the job's timeout: a step timeout fails the step, so the result bundles still upload,
      # while a job timeout cancels the job and skips the upload.
      # Mirrors scripts/unit-tests.sh (serial, skips the UITests target).
      - name: Unit tests
        timeout-minutes: 25
        run: |
          mkdir -p build/results
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "id=$SIM_UDID" \
            -parallel-testing-enabled NO \
            -resultBundlePath build/results/unit-tests.xcresult \
            -skip-testing:simple-recurring-budgetsUITests
      - name: Upload test result bundles
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcresults-unit-tests
          path: build/results/*.xcresult
          retention-days: 7

  # The shards are defined in scripts/ci/ui_shards.py; keep this list equal to its names (a test in
  # scripts/tests/test_ui_shards.py checks). `rest` runs every class no other shard names.
  # Balance shards by suite time (as of 2026-11: AccessibilityAudit ~8 min, UserJourney ~6,
  # ClearAmountButton ~5.5, AllocationFirstTap <1).
  ui-tests:
    name: ui-tests (${{ matrix.shard }})
    runs-on: macos-26
    needs: [build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false # one red shard still lets the others report
      matrix:
        shard: [accessibility, user-journey, rest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ios-setup
      - uses: ./.github/actions/test-products
      # No unit pass runs first on this runner, so boot the simulator and wait for it
      # here; the first UI test then doesn't pay for the boot inside its own timeouts.
      - name: Boot the simulator
        run: xcrun simctl bootstatus "$SIM_UDID" -b
      # One retry per failed test, as the local parallel runs do (scripts/_sim_concurrency.sh).
      # For minutes after boot the simulator is busy with first-boot work, and on these runners
      # that makes accessibility audits time out (-56) or sample contrast mid-render (#360).
      # A test that fails both tries still fails the shard. A warm-up step before the shard was
      # tried in #362 (one UI test, then one unit suite): it cost 2-5 min per shard and didn't
      # stop the slow tests, so there is none.
      - name: UI tests
        timeout-minutes: 35
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p build/results
          filters=()
          while IFS= read -r line; do
            filters+=("$line")
          done < <(python3 scripts/ci/ui_shards.py args "$SHARD")
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "id=$SIM_UDID" \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -resultBundlePath "build/results/ui-tests-${SHARD}.xcresult" \
            "${filters[@]}"
      - name: Upload test result bundles
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcresults-ui-tests-${{ matrix.shard }}
          path: build/results/*.xcresult
          retention-days: 7

  # --- tests: the one required check for all of the above ------------------------
  # Branch protection requires `tests`, not the jobs above, so shards can be added or renamed
  # without touching the ruleset. Passes when build, unit-tests and every ui-tests shard passed,
  # or when `changes` found a docs-only PR and all three were skipped. Anything else (a failure, a
  # cancel, a gate failing first, `changes` failing) fails.
  tests:
    runs-on: ubuntu-latest
    needs: [changes, build, unit-tests, ui-tests]
    if: ${{ !cancelled() }}
    timeout-minutes: 5
    steps:
      - name: Sum up the build and test jobs
        env:
          CODE: ${{ needs.changes.outputs.code }}
          BUILD: ${{ needs.build.result }}
          UNIT: ${{ needs.unit-tests.result }}
          UI: ${{ needs.ui-tests.result }}
        run: |
          echo "changes.code=${CODE} build=${BUILD} unit-tests=${UNIT} ui-tests=${UI}"
          if [[ "$BUILD" == success && "$UNIT" == success && "$UI" == success ]]; then
            exit 0
          fi
          if [[ "$CODE" == false && "$BUILD" == skipped && "$UNIT" == skipped && "$UI" == skipped ]]; then
            echo "Docs-only PR: build and tests skipped."
            exit 0
          fi
          echo "::error::Tests did not pass (build=${BUILD}, unit-tests=${UNIT}, ui-tests=${UI})."
          exit 1

  # --- pr-summary: one consolidated, self-updating PR comment -----------------
  # One comment aggregating every gate, edited in place on re-push. Informational
  # only; do NOT make it a required status check.
  pr-summary:
    runs-on: ubuntu-latest
    needs: [lint, secrets, check-large-files, i18n-gates, changes, build, unit-tests, ui-tests, tests]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Post/update consolidated gate summary
        uses: actions/github-script@v9
        with:
          script: |
            const needs = ${{ toJSON(needs) }};
            const marker = '<!-- ci-gate-summary -->';
            const rows = Object.entries(needs).map(([job, info]) => {
              const icon = info.result === 'success' ? '✅' : info.result === 'skipped' ? '⚪' : '❌';
              return `| ${icon} | \`${job}\` | ${info.result} |`;
            }).join('\n');
            const body = `${marker}\n### CI gate summary\n\n| | Job | Result |\n|---|---|---|\n${rows}\n\n` +
              `See the [full run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for step summaries and details on any failure.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
