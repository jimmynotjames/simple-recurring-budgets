# Runs on every PR and on push to main.
#
# Mirrors the local lefthook gates (lefthook.yml) somewhere unbypassable: hooks can be
# skipped (`git push --no-verify`, hookless clone, web-UI merge). Branch protection on
# `main` should REQUIRE lint, secrets, check-large-files, i18n-gates, test
# (repo Settings -> Rules -> Rulesets); without it CI is advisory.
#
# Runner minutes are free on this public repo, so the `test` job runs the full unit +
# UI suite on every PR that touches more than docs (see the `changes` job;
# run-ui-tests-on-demand.yml re-runs just the UI suite on an open PR). App Store metadata / screenshot-content checks are deliberately NOT here: they
# are release-time (100+ PRs can land between releases) and run in the fastlane
# beta/release lanes (see fastlane/Fastfile).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# PRs: cancel superseded runs on the same branch. Pushes to main: one group per commit,
# so every merge gets its own complete run. Branch protection doesn't require PRs to be
# up to date with main, so this post-merge run is what catches two PRs that pass alone
# but break together.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # --- Tier 1: lint/format parity with local hooks (ubuntu) ------------------
  # Pin the EXACT versions installed locally via Homebrew; skew makes CI fail on rules
  # your machine doesn't enforce (or vice versa). Keep in lockstep with brew installs.
  lint:
    runs-on: ubuntu-latest
    env:
      SWIFTLINT_VERSION: "0.65.1"
      SWIFTFORMAT_VERSION: "0.64.1"
    steps:
      - uses: actions/checkout@v7

      - name: Cache pinned SwiftFormat binary
        uses: actions/cache@v6
        id: cache-swiftformat
        with:
          path: swiftformat_linux
          key: swiftformat-${{ env.SWIFTFORMAT_VERSION }}

      - name: Install pinned SwiftFormat (Linux release binary)
        if: steps.cache-swiftformat.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o swiftformat_linux.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat_linux.zip"
          unzip -o -q swiftformat_linux.zip
          chmod +x swiftformat_linux

      - name: SwiftFormat (check only, no rewrite)
        run: |
          ./swiftformat_linux --version
          ./swiftformat_linux --lint .

      # The official image, not the release zip: that binary needs libxml2.so.2, which
      # Ubuntu 26.04 (ubuntu-latest) dropped (realm/SwiftLint#6966). The workspace is
      # mounted at its own path so reported file paths match the checkout.
      - name: SwiftLint (strict, official Docker image)
        run: |
          image="ghcr.io/realm/swiftlint:${SWIFTLINT_VERSION}"
          docker run --rm "$image" version
          docker run --rm -v "$PWD:$PWD" -w "$PWD" "$image" lint --strict

  # --- Tier 1: secret scan (ubuntu) --------------------------------------------
  # Complements the local `gitleaks protect --staged` hook. Pinned binary instead of
  # gitleaks-action, which needs an org license.
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so `detect` can scan the whole tree
      - name: Cache pinned gitleaks binary
        uses: actions/cache@v6
        id: cache-gitleaks
        with:
          path: gitleaks
          key: gitleaks-${{ env.GITLEAKS_VERSION }}
      - name: Install pinned gitleaks
        if: steps.cache-gitleaks.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: gitleaks detect
        run: |
          ./gitleaks version
          ./gitleaks detect --no-banner --redact

  # --- check-large-files: reject oversized files added/changed in the PR -----
  # Mirrors the pre-commit hook (scripts/check-large-files.sh). CI has no staged
  # files, so diff against the PR base (or the prior push on push-to-main).
  check-large-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Diff files vs base
        id: diff
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          files=$(git diff --name-only --diff-filter=d "$base"...HEAD | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: check-large-files
        if: steps.diff.outputs.files != ''
        run: bash scripts/check-large-files.sh ${{ steps.diff.outputs.files }}

  # --- translation / localization gates (ubuntu) ------------------------------
  # Same gates as the pre-push hook, plus plural/untranslated-copy checks and a
  # non-blocking consistency report.
  i18n-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: check_translations.py
        run: python3 scripts/ci/annotate.py --name check_translations -- python3 scripts/check_translations.py
      - name: check_source_strings.py
        run: python3 scripts/ci/annotate.py --name check_source_strings -- python3 scripts/check_source_strings.py
      - name: check_metadata.py
        run: python3 scripts/ci/annotate.py --name check_metadata -- python3 scripts/translate_metadata/check_metadata.py
      - name: plural_completeness.py
        run: python3 scripts/ci/annotate.py --name plural_completeness -- python3 scripts/translate_audit/plural_completeness.py
      - name: untranslated_copies.py
        run: python3 scripts/ci/annotate.py --name untranslated_copies -- python3 scripts/translate_audit/untranslated_copies.py
      - name: consistency_check (informational, non-blocking)
        run: python3 scripts/translate_audit/consistency_check.py --ignore-casing || true

  # --- changes: does this PR need `test`? -----------------------------------------
  # Docs-only PRs skip `test`, and a skipped required check counts as passing. A PR
  # needs tests if any changed file (old or new path of a rename) is outside the
  # docs-only list below, or is anywhere under an app/test target folder. Pushes to
  # main always test. If the file list can't be read, the tests run.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] \
            && files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
                 --jq '.[] | .filename, (.previous_filename // empty)')" \
            && [ -n "$files" ]; then
            code=false
            while IFS= read -r f; do
              case "$f" in
                simple-recurring-budgets*/*) code=true ;;
                *.md | docs/* | openspec/* | releases/* | .claude/* | .cursor/*) ;;
                *) code=true ;;
              esac
              if [ "$code" = true ]; then
                echo "Needs tests: $f"
                break
              fi
            done <<< "$files"
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  # --- Tier 2: compile + unit + UI tests (macOS) -------------------------------
  # Direct xcodebuild rather than the make/sandbox path (ephemeral runners); keep
  # scheme/project in sync with scripts/build.sh and the test scripts. Compiles once
  # (build-for-testing), so a compile error fails its own step and is reported as PR
  # annotations plus a job summary. Pass 1 mirrors scripts/test-unit.sh (serial, skips
  # UITests, warms the simulator for pass 2). Pass 2 mirrors scripts/test-ui.sh's
  # suite selection.
  test:
    runs-on: macos-26
    needs: [lint, secrets, check-large-files, i18n-gates, changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26.5
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"
      - name: Cache SwiftPM packages
        uses: actions/cache@v6
        with:
          path: build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-xcode26.5-${{ hashFiles('simple-recurring-budgets.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode26.5-
      # Some macos-26 runners start with no iOS simulator runtime, even on an image
      # version that works on other machines, and a hard-coded `name=iPhone 17` then
      # fails with "Unable to find a device matching the provided destination".
      # Install a runtime if none is present, then pin both passes to one device by UDID.
      - name: Ensure an iOS simulator is available
        run: |
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          if ! xcrun simctl list runtimes available | grep -q '^iOS'; then
            echo "::warning::No iOS simulator runtime on this runner; downloading one."
            xcodebuild -downloadPlatform iOS
          fi
          udid="$(python3 - <<'PY'
          import json, re, subprocess

          def run(*args):
              return subprocess.run(["xcrun", "simctl", *args], capture_output=True, text=True, check=True).stdout

          def version(runtime_id):
              return tuple(int(n) for n in re.findall(r"\d+", runtime_id.rsplit(".", 1)[-1]))

          devices = json.loads(run("list", "devices", "available", "--json"))["devices"]
          ios = sorted((r for r in devices if ".iOS-" in r), key=version, reverse=True)
          # Prefer iPhone 17 on the newest iOS runtime, then any iPhone on it.
          for want in ("iPhone 17", "iPhone"):
              for runtime in ios:
                  for d in devices[runtime]:
                      if d["name"] == want or (want == "iPhone" and d["name"].startswith("iPhone")):
                          print(d["udid"])
                          raise SystemExit
          # A freshly downloaded runtime may have no devices yet: create one.
          runtimes = [r for r in json.loads(run("list", "runtimes", "available", "--json"))["runtimes"]
                      if r["platform"] == "iOS"]
          if runtimes:
              newest = max(runtimes, key=lambda r: version(r["identifier"]))
              print(run("create", "iPhone 17", "iPhone 17", newest["identifier"]).strip())
          PY
          )"
          if [ -z "$udid" ]; then
            echo "::error::No iOS simulator available on this runner, even after downloading the iOS platform."
            xcrun simctl list runtimes
            exit 1
          fi
          echo "Using simulator $udid"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      - name: Build for testing
        id: build
        run: |
          set -o pipefail
          # Ad-hoc sign so entitlements (ubiquity-kvstore, CloudKit) are embedded.
          # CODE_SIGNING_ALLOWED=NO strips them and breaks NSUbiquitousKeyValueStore tests.
          xcodebuild build-for-testing \
            -project simple-recurring-budgets.xcodeproj \
            -scheme simple-recurring-budgets \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            2>&1 | tee build-for-testing.log
      - name: Report compile errors
        if: failure() && steps.build.outcome == 'failure'
        run: python3 scripts/ci/xcode_errors.py build-for-testing.log
      - name: Pass 1 — unit tests (warms the simulator)
        run: |
          xcodebuild test-without-building \
            -project simple-recurring-budgets.xcodeproj \
            -scheme simple-recurring-budgets \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            -parallel-testing-enabled NO \
            -skip-testing:simple-recurring-budgetsUITests
      - name: Pass 2 — accessibility + user-journey UI tests
        run: |
          xcodebuild test-without-building \
            -project simple-recurring-budgets.xcodeproj \
            -scheme simple-recurring-budgets \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            -parallel-testing-enabled NO \
            -only-testing:simple-recurring-budgetsUITests/AccessibilityAuditTests \
            -only-testing:simple-recurring-budgetsUITests/UserJourneyTests \
            -only-testing:simple-recurring-budgetsUITests/ClearAmountButtonUITests \
            -only-testing:simple-recurring-budgetsUITests/AllocationFirstTapUITests

  # --- pr-summary: one consolidated, self-updating PR comment -----------------
  # One comment aggregating every gate, edited in place on re-push. Informational
  # only; do NOT make it a required status check.
  pr-summary:
    runs-on: ubuntu-latest
    needs: [lint, secrets, check-large-files, i18n-gates, test]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Post/update consolidated gate summary
        uses: actions/github-script@v9
        with:
          script: |
            const needs = ${{ toJSON(needs) }};
            const marker = '<!-- ci-gate-summary -->';
            const rows = Object.entries(needs).map(([job, info]) => {
              const icon = info.result === 'success' ? '✅' : info.result === 'skipped' ? '⚪' : '❌';
              return `| ${icon} | \`${job}\` | ${info.result} |`;
            }).join('\n');
            const body = `${marker}\n### CI gate summary\n\n| | Job | Result |\n|---|---|---|\n${rows}\n\n` +
              `See the [full run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for step summaries and details on any failure.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
