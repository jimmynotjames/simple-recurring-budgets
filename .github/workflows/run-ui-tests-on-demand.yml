# On-demand UI-only test re-run (accessibility + user-journey suites).
#
# ci.yml's `test` job already runs the full unit + UI suite automatically on
# every PR (simulator minutes are free on this public repo), so this workflow
# is NOT how you get UI coverage — it's a narrower lever: re-run just the UI
# suite on an already-open PR (e.g. for flaky-test triage) without waiting on
# a full unit+UI re-run. Comment
#   /run-ui-tests
# on a PR to kick it off. (Documented in .github/pull_request_template.md so
# it shows on every PR.)
#
# IMPORTANT: issue_comment workflows always run the copy of THIS file on the
# default branch — so `/run-ui-tests` won't work on the PR that introduces
# this rename; it works on PRs opened after it merges to main.
name: Run UI tests (on demand)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  run-ui-tests:
    # Only on PR comments, only the trigger phrase, only from someone with write
    # access (so a drive-by commenter can't burn macOS minutes).
    if: >
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/run-ui-tests') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Acknowledge (👀 on the comment)
        run: |
          gh api -X POST \
            "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes || true

      - name: Resolve PR head SHA
        id: pr
        run: |
          sha=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}" --jq .head.sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.sha }}

      - name: Select Xcode 26.5
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      # UI-suite only — ci.yml's `test` job already re-runs the unit pass on
      # every push, so re-running it here would be pure duplication. Mirrors
      # scripts/test-ui.sh's suite selection; matches how `make test-ui` runs
      # this same suite standalone locally (no separate warm-up pass).
      - name: Accessibility + user-journey UI tests
        run: |
          xcodebuild test \
            -project simple-recurring-budgets.xcodeproj \
            -scheme simple-recurring-budgets \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -derivedDataPath build/DerivedData \
            -parallel-testing-enabled NO \
            -only-testing:simple-recurring-budgetsUITests/AccessibilityAuditTests \
            -only-testing:simple-recurring-budgetsUITests/UserJourneyTests \
            -only-testing:simple-recurring-budgetsUITests/ClearAmountButtonUITests \
            -only-testing:simple-recurring-budgetsUITests/AllocationFirstTapUITests \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=-

      - name: Report result back to the PR
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            body="✅ \`/run-ui-tests\` passed — [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          else
            body="❌ \`/run-ui-tests\` failed — [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi
          gh pr comment "${{ github.event.issue.number }}" --body "$body"
