# Re-runs only the UI suites (accessibility + user-journey) on an open PR, e.g. for
# flaky-test triage. ci.yml's `test` job already runs unit + UI on every PR, so this
# is not needed for coverage. Trigger by commenting `/run-ui-tests` on a PR
# (documented in .github/pull_request_template.md).
#
# IMPORTANT: issue_comment workflows run the copy of THIS file on the default branch,
# so changes here only take effect once merged to main.
name: Run UI tests (on demand)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  run-ui-tests:
    # PR comments only, trigger phrase only, write-access authors only (a drive-by
    # commenter can't burn macOS minutes).
    if: >
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/run-ui-tests') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Acknowledge (👀 on the comment)
        run: |
          gh api -X POST \
            "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes || true

      - name: Resolve PR head SHA
        id: pr
        run: |
          sha=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}" --jq .head.sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.sha }}

      - name: Select Xcode 26.5
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      # UI suite only: ci.yml's `test` job already runs the unit pass. Mirrors
      # scripts/test-ui.sh's suite selection (no separate warm-up pass, like `make test-ui`).
      - name: Accessibility + user-journey UI tests
        run: |
          xcodebuild test \
            -project simple-recurring-budgets.xcodeproj \
            -scheme simple-recurring-budgets \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -derivedDataPath build/DerivedData \
            -parallel-testing-enabled NO \
            -only-testing:simple-recurring-budgetsUITests/AccessibilityAuditTests \
            -only-testing:simple-recurring-budgetsUITests/UserJourneyTests \
            -only-testing:simple-recurring-budgetsUITests/ClearAmountButtonUITests \
            -only-testing:simple-recurring-budgetsUITests/AllocationFirstTapUITests \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=-

      - name: Report result back to the PR
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            body="✅ \`/run-ui-tests\` passed — [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          else
            body="❌ \`/run-ui-tests\` failed — [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi
          gh pr comment "${{ github.event.issue.number }}" --body "$body"
