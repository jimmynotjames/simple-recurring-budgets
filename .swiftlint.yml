# https://realm.github.io/SwiftLint/rule-directory.html
# Thresholds balance the plan with a passing baseline on the current tree; tighten over time.
disabled_rules:
  - trailing_whitespace
  # SwiftFormat uses trailing commas for multiline collection literals.
  - trailing_comma
  # Common in tests and SwiftUI previews; SwiftFormat handles brace placement elsewhere.
  - implicit_optional_initialization
  # Product placeholders tracked outside SwiftLint until launch.
  - todo

opt_in_rules:
  - empty_count
  - first_where
  - toggle_bool
  - redundant_nil_coalescing
  - sorted_imports
  - modifier_order
  - contains_over_first_not_nil
  - vertical_whitespace_closing_braces

excluded:
  - .build
  - simple-recurring-budgets.xcodeproj

line_length:
  warning: 225
  error: 275
  ignores_urls: true
  ignores_function_declarations: true
  ignores_comments: true

function_body_length:
  warning: 120
  error: 150

file_length:
  warning: 750
  error: 900

type_body_length:
  warning: 500
  error: 550

function_parameter_count:
  warning: 10
  error: 12

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - x
    - y
    - i
    - j
    - s
    - vm
    - c
    - n
    - b
    - b1
    - b2
    - p
    - q
    - d
    - ui
    - e

type_name:
  excluded:
    - simple_recurring_budgetsApp
    - simple_recurring_budgetsTests
    - simple_recurring_budgetsUITests
    - simple_recurring_budgetsUITestsLaunchTests
