# https://lefthook.dev/configuration/
pre-commit:
  parallel: false
  commands:
    swiftformat:
      glob: "**/*.swift"
      run: swiftformat {staged_files}
      stage_fixed: true

    swiftlint-fix:
      glob: "**/*.swift"
      run: swiftlint --fix --quiet {staged_files}
      stage_fixed: true

    swiftlint:
      glob: "**/*.swift"
      run: swiftlint lint --strict {staged_files}

    check-merge-conflicts:
      run: bash -c 'set -f; files=(); for f in {staged_files}; do [ "$f" = lefthook.yml ] || files+=("$f"); done; [ "${#files[@]}" -eq 0 ] || ! grep -q "<<<""<<<<" -- "${files[@]}"'

    check-large-files:
      run: bash scripts/check-large-files.sh {staged_files}

    gitleaks:
      run: gitleaks protect --staged --no-banner

pre-push:
  commands:
    build:
      run: bash scripts/build.sh
