# https://lefthook.dev/configuration/
pre-commit:
  parallel: false
  commands:
    swiftformat:
      glob: "**/*.swift"
      run: swiftformat {staged_files}
      stage_fixed: true

    swiftlint-fix:
      glob: "**/*.swift"
      run: swiftlint --fix --quiet {staged_files}
      stage_fixed: true

    swiftlint:
      glob: "**/*.swift"
      run: swiftlint lint --strict {staged_files}

    check-merge-conflicts:
      run: bash -c 'set -f; files=(); for f in {staged_files}; do [ "$f" = lefthook.yml ] || files+=("$f"); done; [ "${#files[@]}" -eq 0 ] || ! grep -q "<<<""<<<<" -- "${files[@]}"'

    check-large-files:
      run: bash scripts/check-large-files.sh {staged_files}

    gitleaks:
      run: gitleaks git --pre-commit --staged --no-banner

pre-push:
  commands:
    # Checks the refs being pushed (from git's stdin), not the checked-out branch. Fails faster
    # than the server-side protection that also covers main and gh-pages.
    no-direct-protected-push:
      run: bash scripts/check-push-refs.sh
      use_stdin: true

    check-translations:
      run: python3 scripts/check_translations.py

    check-source-strings:
      run: python3 scripts/check_source_strings.py

    build:
      run: bash scripts/build.sh
