schema: spec-driven

context: |
  Platform: iOS / iPadOS / macOS native app (SwiftUI, SwiftData, CloudKit)
  Language: Latest stable Swift
  Testing: Swift Testing framework
  Architecture: No backend; on-device SwiftData persistence with CloudKit sync
  Design: Apple Human Interface Guidelines, minimalistic and elegant
  Accessibility: Dynamic Type, VoiceOver
  Internationalization: All languages, per-budget currency

  High-level docs (source of truth for product and architecture): docs/main-prd.md (constraints, glossary, Over/Under vs remaining); docs/product-features-planning.md (F-x.xx, acceptance criteria); docs/tech-design-doc.md (MVVM/@Observable, navigation, SwiftData + CloudKit, data model, i18n/a11y/testing, performance, security).

  Cross-cutting ongoing concerns (docs/main-prd.md §6.8): Accessibility, localized source strings, translations queue, and Mixpanel user-action analytics apply to every UI-touching change. See AGENTS.md > Cross-cutting concerns for the checklist.

  Doc checks apply during planning and read-only modes: skim those three files before drafting or refining proposals, design, specs, tasks, or implementation plans. If direction contradicts the docs, surface a short "Conflict with docs" note (which file, what it says; resolve by updating the doc, changing the plan, or explicit exception). Do not silently override PRD, tech-design, or feature IDs.

  Written plans: if the topic touches product rules, feature IDs, architecture, data model, sync, or global constraints, include Doc alignment or Conflicts with docs and list which docs/*.md files need updates after implementation (or none).

  When artifacts or implementation materially change product constraints, F-x.xx, acceptance criteria, architecture, data model, sync, or i18n/a11y/testing expectations, update the matching docs file(s) or add an explicit task before archive: product-features-planning.md (features/IDs/acceptance), tech-design-doc.md (schema/CloudKit/architecture), main-prd.md (global constraints/glossary).

  Apply / implementation: when work changes behavior covered by docs/, either update docs in-repo as part of tasks or leave an explicit follow-up task; do not treat the change as complete with drift versus those three files.

  Build/test during apply: after code changes follow the four-step procedure in AGENTS.md > Build and test (make format → make lint-fix → make build → make test) rather than running bare make test; this applies regardless of which tool is running OpenSpec.

  Translations during plan + apply: when a change adds, renames, or invalidates user-facing strings (`Localizable.xcstrings` keys), the preferred way to bring translations current is the project's `translate-new-strings` skill — the canonical entry point that drives `scripts/translate_catalog/` in subset mode (extract → translate → merge → validate) with parallel per-locale subagents and ends on a clean `check_translations.py`. Plans that touch localization SHALL include a task to run it, and apply SHALL run it autonomously (no approval prompt) using its temp-file invocations rather than ad-hoc python/heredocs.

  Verify: compare implementation and specs to the three docs/*.md files; flag docs drift (missing or contradictory updates) as issues to fix before archive.

  Archive: when delta specs exist for the change being archived, sync them to the main specs automatically — do NOT prompt the user "do you want to sync?". The standing project preference is always yes. Invoke openspec-sync-specs inline (from the parent agent via the Skill tool; do not delegate to a sub-agent). Only prompt the user if the sync itself surfaces a genuine merge ambiguity (e.g. a MODIFIED block targets a non-existent requirement, or a delta conflicts with a parallel main-spec edit). After the archive, assess whether docs/ need updates; prompt to update now or defer and warn if deferred.

  Sync (delta to main specs): merging specs does not update docs/; if the change materially affects product or architecture, remind to update docs/ or call out conflicts with docs.

rules:
  proposal:
    - After skimming docs/main-prd.md, docs/product-features-planning.md, and docs/tech-design-doc.md, note Doc alignment or Conflicts with docs before finalizing the proposal.
  design:
    - Ensure design aligns with docs/tech-design-doc.md and docs/main-prd.md; call out conflicts explicitly.
  tasks:
    - Include a task to update relevant docs/*.md when the change affects product features, architecture, or global constraints—or explicitly confirm no doc updates are needed.
    - For changes that add or modify user-facing UI, include explicit task line items for the cross-cutting concerns in docs/main-prd.md §6.8 (accessibility labels/hints; localized source strings with comment:; translations — run the `translate-new-strings` skill, the preferred pipeline entry point that drives scripts/translate_catalog; Mixpanel user-action events) — or explicitly state which do not apply.
  apply:
    - For any task that adds or modifies user-facing UI, verify that the cross-cutting concerns from docs/main-prd.md §6.8 are addressed before marking the task complete: (1) accessibility labels/hints on new controls, (2) new strings keyed in Localizable.xcstrings with comment:, (3) translations brought current by running the `translate-new-strings` skill — the preferred entry point that drives scripts/translate_catalog (extract → translate → merge → validate) and ends on a clean check_translations.py; run it autonomously without prompting, and use its temp-file invocations rather than ad-hoc python/heredocs, (4) AnalyticsClient.track(...) fired for new user-initiated actions per docs/analytics-spec.md. If any concern was not addressed in the task, add it now or flag it explicitly.
  specs:
    - If requirements conflict with the three docs/*.md files, document the conflict in the delta spec or proposal rather than silently overriding.
