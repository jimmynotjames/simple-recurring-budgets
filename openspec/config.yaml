schema: spec-driven

context: |
  Platform: iOS / iPadOS / macOS native app (SwiftUI, SwiftData, CloudKit)
  Language: Latest stable Swift
  Testing: Swift Testing framework
  Architecture: No backend; on-device SwiftData persistence with CloudKit sync
  Design: Apple Human Interface Guidelines, minimalistic and elegant
  Accessibility: Dynamic Type, VoiceOver
  Internationalization: All languages, per-budget currency

  High-level docs (source of truth for product and architecture): docs/main-prd.md (constraints, glossary, Over/Under vs remaining); docs/product-features-planning.md (F-x.xx, acceptance criteria); docs/tech-design-doc.md (MVVM/@Observable, navigation, SwiftData + CloudKit, data model, i18n/a11y/testing, performance, security).

  Cross-cutting ongoing concerns (docs/main-prd.md §6.8): Accessibility, localized source strings, translations queue, and Mixpanel user-action analytics apply to every UI-touching change. Checklist: AGENTS.md > Cross-cutting concerns.

  Doc checks apply during planning and read-only modes: skim those three files before drafting or refining proposals, design, specs, tasks, or implementation plans. If direction contradicts the docs, add a short "Conflict with docs" note (which file, what it says; resolve by updating the doc, changing the plan, or explicit exception). Don't silently override PRD, tech-design, or feature IDs.

  Written plans: if the plan touches product rules, feature IDs, architecture, data model, sync, or global constraints, include Doc alignment or Conflicts with docs and list which docs/*.md files need updates after implementation (or none).

  When artifacts or implementation materially change product constraints, F-x.xx, acceptance criteria, architecture, data model, sync, or i18n/a11y/testing expectations, update the matching docs file(s) or add an explicit task before archive: product-features-planning.md (features/IDs/acceptance), tech-design-doc.md (schema/CloudKit/architecture), main-prd.md (global constraints/glossary).

  Apply / implementation: when work changes behavior covered by docs/, update the docs as part of tasks or leave an explicit follow-up task; a change isn't complete while it drifts from those three files.

  Build/test during apply: after code changes run `make gate` per AGENTS.md > Build and test (format and lint on changed files, script tests, compile; no simulator), plus `make focused-tests` for the tests the change touched. The full unit and UI suites run in PR CI, in any tool.

  Translations during plan + apply: when a change adds, renames, or invalidates user-facing strings (`Localizable.xcstrings` keys), bring translations current with the project's `translate-new-strings` skill, the canonical entry point that drives `scripts/translate_catalog/` in subset mode (extract → translate → merge → validate) with parallel per-locale subagents and ends on a clean `check_translations.py`. Plans that touch localization SHALL include a task to run it, and apply SHALL run it autonomously (no approval prompt) using its temp-file invocations rather than ad-hoc python/heredocs.

  Verify: compare implementation and specs to the three docs/*.md files; flag docs drift (missing or contradictory updates) as issues to fix before archive.

  Archive: when delta specs exist for the change being archived, sync them to the main specs automatically; do NOT prompt "do you want to sync?" (standing preference: always yes). Invoke openspec-sync-specs inline from the parent agent via the Skill tool, not a sub-agent. Only prompt the user if the sync itself surfaces a genuine merge ambiguity (e.g. a MODIFIED block targets a non-existent requirement, or a delta conflicts with a parallel main-spec edit). After the archive, assess whether docs/ need updates; prompt to update now or defer and warn if deferred.

  Sync (delta to main specs): merging specs doesn't update docs/; if the change materially affects product or architecture, remind to update docs/ or call out conflicts.

rules:
  proposal:
    - After skimming docs/main-prd.md, docs/product-features-planning.md, and docs/tech-design-doc.md, note Doc alignment or Conflicts with docs before finalizing the proposal.
  design:
    - Ensure design aligns with docs/tech-design-doc.md and docs/main-prd.md; call out conflicts explicitly.
  tasks:
    - Include a task to update relevant docs/*.md when the change affects product features, architecture, or global constraints—or explicitly confirm no doc updates are needed.
    - For changes that add or modify user-facing UI, include explicit task line items for the cross-cutting concerns in docs/main-prd.md §6.8 (accessibility labels/hints; localized source strings with comment:; translations via the `translate-new-strings` skill (drives scripts/translate_catalog); Mixpanel user-action events, AND updating docs/analytics-spec.md §9–§10 whenever the change alters what analytics emits — new/changed event, new/removed event property, a new value in a categorical property's enum such as a new period/icloud_state value, changed bucket boundaries, or a new super/people property) — or explicitly state which do not apply.
  apply:
    - For any task that adds or modifies user-facing UI, verify that the cross-cutting concerns from docs/main-prd.md §6.8 are addressed before marking the task complete: (1) accessibility labels/hints on new controls, (2) new strings keyed in Localizable.xcstrings with comment:, (3) translations brought current by the `translate-new-strings` skill (drives scripts/translate_catalog through extract → translate → merge → validate, ends on a clean check_translations.py), run autonomously without prompting via its temp-file invocations rather than ad-hoc python/heredocs, (4) AnalyticsClient.track(...) fired for new user-initiated actions per docs/analytics-spec.md, AND docs/analytics-spec.md §9–§10 updated (with a Revision-History entry) when the change alters what analytics emits — a new/changed event, a new/removed event property, a new value in a categorical property's enum (e.g. a new period/icloud_state value), changed bucket boundaries, or a new super/people property. If any concern was not addressed in the task, add it now or flag it explicitly.
  specs:
    - If requirements conflict with the three docs/*.md files, document the conflict in the delta spec or proposal rather than silently overriding.
