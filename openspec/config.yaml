schema: spec-driven

context: |
  Platform: iOS / iPadOS / macOS native app (SwiftUI, SwiftData, CloudKit)
  Language: Latest stable Swift
  Testing: Swift Testing framework
  Architecture: No backend; on-device SwiftData persistence with CloudKit sync
  Design: Apple Human Interface Guidelines, minimalistic and elegant
  Accessibility: Dynamic Type, VoiceOver
  Internationalization: All languages, per-budget currency
  Always check: docs/main-prd.md (product constraints and glossary, including Over/Under vs remaining); docs/product-features-planning.md (feature IDs F-x.xx and acceptance criteria); docs/tech-design-doc.md (technical design: MVVM/@Observable, navigation, SwiftData + CloudKit setup and constraints, data model approach, i18n/a11y/testing expectations, performance and security)

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
